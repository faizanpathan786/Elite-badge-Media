<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="asgradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Professional rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#asgradient)"/>
  <!-- Inner subtle shadow/depth -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <!-- "AS" Text - Professional Monogram -->
  <text x="64" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" text-anchor="middle" fill="white" letter-spacing="2">AS</text>
</svg>